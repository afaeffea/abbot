<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Warpoint — текстовый чат</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>Warpoint — текстовый чат</h1>
    <div class="nav-links">
      <a class="nav-link" href="/">← Голосовой звонок</a>
      <a class="nav-link" href="/logs.html">Логи звонков →</a>
    </div>

    <button id="chat-toggle" class="call-button" data-state="idle">
      💬 Начать чат
    </button>
    <div id="chat-state" class="call-state"></div>

    <div id="chat-box" class="chat-box"></div>

    <form id="chat-form" class="chat-form">
      <input id="chat-input" type="text" placeholder="Напишите сообщение…" autocomplete="off" disabled />
      <button id="chat-send" type="submit" disabled>Отправить</button>
    </form>
  </main>

  <script src="chat.js"></script>
</body>
</html>
